<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="Verdana, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
  <text x="16" y="30" font-size="13" fill="#555555">TOP-2</text>

  <!-- top event -->
  <rect x="205" y="16" width="230" height="52" rx="4" fill="#fde8e8" stroke="#333333" stroke-width="1.5"/>
  <text x="320" y="38" font-size="13" text-anchor="middle" fill="#111111">Misleading report</text>
  <text x="320" y="56" font-size="13" text-anchor="middle" fill="#111111">delivered to the user</text>

  <!-- OR gate G3 -->
  <line x1="320" y1="68" x2="320" y2="96" stroke="#333333" stroke-width="1.5"/>
  <path d="M 320 96 Q 294 114 294 148 Q 320 132 346 148 Q 346 114 320 96 Z" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/>
  <text x="358" y="126" font-size="12" fill="#555555">G3: OR</text>

  <!-- bus to basic events -->
  <line x1="320" y1="142" x2="320" y2="180" stroke="#333333" stroke-width="1.5"/>
  <line x1="110" y1="180" x2="530" y2="180" stroke="#333333" stroke-width="1.5"/>
  <line x1="110" y1="180" x2="110" y2="216" stroke="#333333" stroke-width="1.5"/>
  <line x1="320" y1="180" x2="320" y2="216" stroke="#333333" stroke-width="1.5"/>
  <line x1="530" y1="180" x2="530" y2="216" stroke="#333333" stroke-width="1.5"/>

  <!-- basic events E7..E9 -->
  <circle cx="110" cy="252" r="36" fill="#e8f3ec" stroke="#333333" stroke-width="1.5"/>
  <text x="110" y="258" font-size="14" text-anchor="middle" fill="#111111">E7</text>
  <text x="110" y="314" font-size="12" text-anchor="middle" fill="#333333">Unit conversion</text>
  <text x="110" y="330" font-size="12" text-anchor="middle" fill="#333333">fault</text>

  <circle cx="320" cy="252" r="36" fill="#e8f3ec" stroke="#333333" stroke-width="1.5"/>
  <text x="320" y="258" font-size="14" text-anchor="middle" fill="#111111">E8</text>
  <text x="320" y="314" font-size="12" text-anchor="middle" fill="#333333">Report served from</text>
  <text x="320" y="330" font-size="12" text-anchor="middle" fill="#333333">stale cache</text>

  <circle cx="530" cy="252" r="36" fill="#e8f3ec" stroke="#333333" stroke-width="1.5"/>
  <text x="530" y="258" font-size="14" text-anchor="middle" fill="#111111">E9</text>
  <text x="530" y="314" font-size="12" text-anchor="middle" fill="#333333">Rounding drift</text>
  <text x="530" y="330" font-size="12" text-anchor="middle" fill="#333333">in aggregation</text>

  <text x="320" y="396" font-size="12" text-anchor="middle" fill="#777777">Fault tree TOP-2: any single basic event is enough to deliver a misleading report (first-order cut sets).</text>
</svg>
